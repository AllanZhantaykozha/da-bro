<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Каталог — DA BRO</title>
  <meta name="description" content="Каталог DA BRO: верхняя одежда, костюмы, рубашки, трикотаж, брюки, обувь и аксессуары.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23121212'/><text x='50%' y='56%' text-anchor='middle' dominant-baseline='middle' font-family='Arial' font-weight='700' font-size='22' fill='%23c9b48f'>DB</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body data-page="catalog">
<main>
  <div class="wrap page-head">
    <nav class="crumbs" aria-label="Навигация"><a href="index.html">Главная</a><span>/</span><span>Каталог</span></nav>
    <h1 class="h2" id="title">Каталог</h1>
  </div>
  <div class="toolbar">
    <div class="wrap">
      <div class="toolbar__row">
        <label class="search">
          <span class="sr">Поиск по каталогу</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
          <input id="q" type="search" placeholder="Поиск: пальто, костюм…" autocomplete="off">

        </label>
        <div class="cselect">
          <select id="sort" aria-label="Сортировка" data-label="Сортировка">
            <option value="pop">Популярные</option>
            <option value="new">Сначала новинки</option>
            <option value="asc">Сначала дешевле</option>
            <option value="desc">Сначала дороже</option>
          </select>
        </div>
      </div>
      <div class="chips-row" id="chips" role="toolbar" aria-label="Категории"></div>
    </div>
  </div>
  <div class="wrap">
    <div class="result-line"><span id="found"></span><span>Наличие: <b data-city-name style="color:var(--ink)">Астана</b></span></div>
    <div class="grid" id="grid" aria-live="polite"></div>
